<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APTET Paper 2A – Full Mock Test 11</title>
  <style>
    :root {
      --navy: #0b2447;
      --teal: #0e9aa7;
      --bg: #f3f5f9;
      --card: #ffffff;
      --text: #18212f;
      --muted: #5b6678;
      --line: #d3dae6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 980px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin-top: 0;
      color: var(--navy);
      font-size: 2rem;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
    }

    .status {
      display: inline-block;
      background: #e3f6f7;
      color: var(--navy);
      border: 1px solid #bfecef;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>APTET Paper 2A – Full Mock Test 11</h1>
      <p>This file has been repaired and is now valid HTML.</p>
      <div class="status">Status: Fixed</div>
    </div>
  </div>
</body>
</html>
