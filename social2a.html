const app=document.getElementById('app');
const SHEET=new URLSearchParams(location.search).get('sheet')||CFG.SHEET;
const NT=Math.ceil(Q.length/CFG.PER);
const DIST=["Alluri Sitharama Raju","Anakapalli","Ananthapuramu","Annamayya","Bapatla","Chittoor","Dr. B.R. Ambedkar Konaseema","East Godavari","Eluru","Guntur","Kakinada","Krishna","Kurnool","Nandyal","NTR","Palnadu","Parvathipuram Manyam","Prakasam","Sri Potti Sriramulu Nellore","Sri Sathya Sai","Srikakulam","Tirupati","Visakhapatnam","Vizianagaram","West Godavari","YSR Kadapa","Other"];
let skew=0,S=null,tick=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const now=()=>Date.now()+skew, openAt=()=>new Date(CFG.OPEN).getTime(), isOpen=()=>now()>=openAt();
const tid=t=>CFG.ID+"-T"+String(t+1).padStart(2,'0');
async function sync(){try{const r=await fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'});const d=r.headers.get('Date');if(d)skew=new Date(d).getTime()-Date.now()}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const foot=()=>`<div class="ft">Created by <b>${esc(CFG.CREDIT)}</b></div>`;

function home(){
  clearInterval(tick);S=null;window.scrollTo(0,0);
  const open=isOpen();
  let g='';for(let t=0;t<NT;t++){const a=t*CFG.PER+1,b=Math.min((t+1)*CFG.PER,Q.length);
    g+=`<button class="tb ${open?'':'off'}" data-t="${t}">Test ${t+1}<small>Q ${a}–${b}</small></button>`}
  app.innerHTML=`<div class="hd"><h1>${esc(CFG.TITLE)}</h1><p>${NT} tests × ${CFG.PER} questions · English + తెలుగు</p></div>
  <div class="wrap">
  ${open?'':`<div class="lock">⏳ This quiz will open at <b>${CFG.OPEN_TXT}</b>.<br>ఈ క్విజ్ <b>27-09-2026 సాయంత్రం 6 గంటలకు (IST)</b> ప్రారంభమవుతుంది.<div id="cd"></div></div>`}
  <div class="card"><label for="nm">Name / పేరు *</label><input id="nm" maxlength="50" autocomplete="name" placeholder="Enter your full name" value="${esc(st.get('q_nm'))}">
  <label for="ds">District / జిల్లా *</label><input id="ds" list="dl" maxlength="40" placeholder="Select or type district" value="${esc(st.get('q_ds'))}">
  <datalist id="dl">${DIST.map(d=>`<option value="${d}">`).join('')}</datalist>
  <div class="err" id="er"></div></div>
  <div class="grid">${g}</div></div>${foot()}`;
  if(!open){const cd=document.getElementById('cd');tick=setInterval(()=>{let s=Math.max(0,Math.floor((openAt()-now())/1000));
    if(s<=0){clearInterval(tick);home();return}
    const d=Math.floor(s/86400);s%=86400;cd.textContent=(d?d+'d ':'')+[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')},1000)}
}
function start(t){
  const nm=document.getElementById('nm').value.trim(),ds=document.getElementById('ds').value.trim(),er=document.getElementById('er');
  if(!isOpen()){er.textContent="Quiz opens at "+CFG.OPEN_TXT+" / క్విజ్ ఇంకా ప్రారంభం కాలేదు";return}
  if(nm.length<2||ds.length<2){er.textContent="Name and District are mandatory / పేరు, జిల్లా తప్పనిసరి";(nm.length<2?document.getElementById('nm'):document.getElementById('ds')).focus();return}
  st.set('q_nm',nm);st.set('q_ds',ds);S={t,nm,ds,done:false};begin()
}
function begin(){
  const t=S.t,base=Q.slice(t*CFG.PER,(t+1)*CFG.PER);
  S.qs=shuffle(base).map((q,i)=>{const ix=shuffle([0,1,2,3]);return{no:t*CFG.PER+i+1,e:q.e,t:q.t,x:q.x,o:ix.map(j=>q.o[j]),ans:ix.indexOf(q.a),pick:-1}});
  S.t0=Date.now();S.done=false;
  const L='ABCD';
  app.innerHTML=`<div class="bar"><div class="in"><b>Test ${t+1}</b> · <span id="pg"></span><br><span id="sc"></span> · ⏱ <span id="tm">00:00</span></div><button class="sub" id="sb">Submit ✔</button></div>
  <div class="wrap" id="main"><div id="rs"></div><div id="ql">${S.qs.map((q,i)=>`<div class="q" id="q${i}" data-st="sk">
   <div class="qn">Q${q.no}.</div><div class="qe">${esc(q.e)}</div>${q.t?`<div class="qt">${esc(q.t)}</div>`:''}
   ${q.o.map((o,k)=>{const p=o.split(' · ');return`<button class="op" data-i="${i}" data-k="${k}"><span class="lt">${L[k]}</span><span class="tx">${esc(p[0])}${p[1]?`<i>${esc(p.slice(1).join(' · '))}</i>`:''}</span><span class="mk"></span></button>`}).join('')}
   <div class="nt"></div></div>`).join('')}</div></div>${foot()}`;
  upd();clearInterval(tick);tick=setInterval(()=>{const s=Math.floor((Date.now()-S.t0)/1000);document.getElementById('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
  window.scrollTo(0,0)
}
function upd(){
  const a=S.qs.filter(q=>q.pick>=0),c=a.filter(q=>q.pick===q.ans).length;
  document.getElementById('pg').textContent=a.length+'/'+S.qs.length+' answered';
  document.getElementById('sc').innerHTML=`Score <b>${c}</b>/${S.qs.length} · ✔ ${c} · ✘ ${a.length-c}`;
}
function paint(i,reveal){
  const q=S.qs[i],c=document.getElementById('q'+i),bs=c.querySelectorAll('.op');
  const ans=q.pick>=0;c.dataset.st=!ans?'sk':(q.pick===q.ans?'ok':'no');
  bs.forEach((b,k)=>{b.disabled=true;b.classList.remove('ok','no');const m=b.querySelector('.mk');m.textContent='';
    if(ans&&k===q.pick&&k!==q.ans){b.classList.add('no');m.textContent='✘'}
    if((ans||reveal)&&k===q.ans){b.classList.add('ok');m.textContent='✔'}});
  const n=c.querySelector('.nt');n.innerHTML=(!ans&&reveal?'<span class="sk">Not answered / సమాధానం ఇవ్వలేదు</span>':'')+(q.x?`<div class="note">${esc(q.x.replace(/^వివరణ:\s*/,''))}</div>`:'')
}
function pick(i,k){const q=S.qs[i];if(S.done||q.pick>=0)return;q.pick=k;paint(i);upd()}
function ask(un){return new Promise(r=>{const d=document.createElement('div');d.className='mdl';
  d.innerHTML=`<div><p><b>${un?`${un} question(s) not answered.<br>${un} ప్రశ్నలకు సమాధానం ఇవ్వలేదు.`:'Submit the test?<br>పరీక్షను సమర్పించాలా?'}</b></p><p>Submit now? / ఇప్పుడు సమర్పించాలా?</p><button class="btn p" id="y">Submit</button> <button class="btn" id="n">Continue</button></div>`;
  document.body.appendChild(d);d.querySelector('#y').onclick=()=>{d.remove();r(true)};d.querySelector('#n').onclick=()=>{d.remove();r(false)}})}
async function submit(){
  if(S.done)return;const un=S.qs.filter(q=>q.pick<0).length;if(!await ask(un))return;
  S.done=true;clearInterval(tick);
  const secs=Math.floor((Date.now()-S.t0)/1000);S.qs.forEach((q,i)=>paint(i,true));
  const c=S.qs.filter(q=>q.pick===q.ans).length,w=S.qs.filter(q=>q.pick>=0&&q.pick!==q.ans).length,n=S.qs.length;
  document.getElementById('sb').style.display='none';
  document.getElementById('rs').innerHTML=`<div class="res"><div>${esc(S.nm)} · ${esc(S.ds)}</div><div class="big">${c} / ${n}</div>
  <div>${Math.round(c*100/n)}% · ✔ ${c} correct · ✘ ${w} wrong · ${n-c-w} skipped · ⏱ ${Math.floor(secs/60)}m ${secs%60}s</div>
  <div class="chips"><button class="chip on" data-f="">All</button><button class="chip" data-f="f-ok">✔ Correct</button><button class="chip" data-f="f-no">✘ Wrong</button><button class="chip" data-f="f-sk">Skipped</button></div>
  <button class="btn p" id="rt">Retry / మళ్ళీ</button> <button class="btn" id="hm">All tests</button>
  <div id="lb"></div></div>`;
  window.scrollTo(0,0);
  if(SHEET){fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({testId:tid(S.t),name:S.nm,district:S.ds,score:c,total:n,wrong:w,skipped:n-c-w,timeSec:secs})}).catch(()=>{});
    setTimeout(lb,1800)}
}
async function lb(){
  const el=document.getElementById('lb');if(!el||!SHEET)return;el.innerHTML='<p>Loading leaderboard…</p>';
  try{const r=await fetch(SHEET+(SHEET.includes('?')?'&':'?')+'action=leaderboard&testId='+tid(S.t));const j=await r.json();
    el.innerHTML=`<h3>🏆 Leaderboard · ${tid(S.t)}</h3><table><tr><th>#</th><th>Name</th><th>District</th><th>Score</th></tr>${(j.rows||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.district)}</td><td>${esc(x.score)}/${esc(x.total)}</td></tr>`).join('')}</table>`}
  catch(e){el.innerHTML=''}
}
document.addEventListener('click',e=>{
  const o=e.target.closest('.op');if(o){pick(+o.dataset.i,+o.dataset.k);return}
  const t=e.target.closest('.tb');if(t){start(+t.dataset.t);return}
  const f=e.target.closest('.chip');if(f){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===f));document.getElementById('ql').className=f.dataset.f;return}
  if(e.target.id==='sb')submit();
  if(e.target.id==='rt'){S.done=false;begin()}
  if(e.target.id==='hm')home();
});
/* deterrents: right-click, copy, view-source, dev-tools shortcuts */
['contextmenu','copy','cut','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.tagName!=='INPUT')e.preventDefault()}));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.key==='F12'||(c&&['u','s','p'].includes(k))||(c&&e.shiftKey&&['i','j','c','k'].includes(k))||(c&&!e.target.matches('input')&&['c','a','x'].includes(k)))e.preventDefault()});
sync().then(home);
</script>
</body>
</html>
